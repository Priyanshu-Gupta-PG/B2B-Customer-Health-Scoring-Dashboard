services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: health_user
      POSTGRES_PASSWORD: health_password
      POSTGRES_DB: health_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U health_user -d health_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local stand-ins for the Vercel mock websites.
  # Start with: docker compose --profile local-mocks up
  stripe-mock:
    profiles: ["local-mocks"]
    image: node:20-alpine
    working_dir: /app/stripe
    command: sh -c "npm ci --omit=dev && node server.mjs"
    volumes:
      - ./mock-sources:/app
    ports:
      - "4101:4101"
    environment:
      PORT: 4101

  zendesk-mock:
    profiles: ["local-mocks"]
    image: node:20-alpine
    working_dir: /app/zendesk
    command: sh -c "npm ci --omit=dev && node server.mjs"
    volumes:
      - ./mock-sources:/app
    ports:
      - "4102:4102"
    environment:
      PORT: 4102

  product-mock:
    profiles: ["local-mocks"]
    image: node:20-alpine
    working_dir: /app/product
    command: sh -c "npm ci --omit=dev && node server.mjs"
    volumes:
      - ./mock-sources:/app
    ports:
      - "4103:4103"
    environment:
      PORT: 4103

  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://health_user:health_password@postgres:5432/health_db
      FRONTEND_ORIGIN: http://localhost:3000
      LOG_LEVEL: info
      STRIPE_MOCK_URL: https://ledger-wire-stripe-mock.vercel.app
      ZENDESK_MOCK_URL: https://desk-relay-zendesk-mock.vercel.app
      PRODUCT_MOCK_URL: https://signal-meter-product-mock.vercel.app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
