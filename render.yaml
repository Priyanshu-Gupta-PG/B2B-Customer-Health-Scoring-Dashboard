services:
  # ----------------------------------------------------
  # 1. Express API Backend
  # ----------------------------------------------------
  - type: web
    name: b2b-health-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: BCRYPT_COST
        value: 12
      - key: INGEST_CRON
        value: "*/15 * * * *"
      - key: SNAPSHOT_CRON
        value: "0 0 * * *"
      - key: SEED_ACCOUNT_COUNT
        value: 150

  # ----------------------------------------------------
  # 2. Next.js Frontend
  # ----------------------------------------------------
  - type: web
    name: b2b-health-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        sync: false
