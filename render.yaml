# Prefer Native Node + rootDir (below). If a service is created as Docker instead,
# point Dockerfile Path at ./Dockerfile (API) or ./frontend/Dockerfile (UI).
services:
  # ----------------------------------------------------
  # 1. Express API Backend
  # ----------------------------------------------------
  - type: web
    name: b2b-health-backend
    runtime: node
    rootDir: backend
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
      - key: BCRYPT_COST
        value: 12
      - key: INGEST_CRON
        value: "*/15 * * * *"
      - key: SNAPSHOT_CRON
        value: "0 0 * * *"
      - key: SEED_ACCOUNT_COUNT
        value: 50
      # Auto-seed empty DB on boot (needed on free plan — no Shell access)
      - key: SEED_ON_BOOT
        value: "true"
      # Live mock data websites (required — no local jitter fallback in current main)
      - key: STRIPE_MOCK_URL
        value: https://ledger-wire-stripe-mock.vercel.app
      - key: ZENDESK_MOCK_URL
        value: https://desk-relay-zendesk-mock.vercel.app
      - key: PRODUCT_MOCK_URL
        value: https://signal-meter-product-mock.vercel.app

  # ----------------------------------------------------
  # 2. Next.js Frontend
  # ----------------------------------------------------
  - type: web
    name: b2b-health-frontend
    runtime: node
    rootDir: frontend
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_USE_MOCKS
        value: "false"
      - key: NEXT_PUBLIC_API_URL
        sync: false
